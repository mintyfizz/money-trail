name: Build national pilot

# Heavy job: downloads national contracts archives on a GitHub runner, builds the typed transaction
# layer, aggregates and reconciles. Starts only when the dedicated branch is pushed, or by hand.
on:
  push:
    branches: [run/build-pilot]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-national-pilot
  cancel-in-progress: false

env:
  RESERVE_GIB: 8

jobs:
  year:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        year: [2021, 2022, 2023, 2024, 2025]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Tests
        run: python -m unittest discover -s tests

      - name: Find the national contracts file
        id: find
        run: |
          python -m pipeline.fetch --year ${{ matrix.year }} > source.json
          cat source.json
          echo "url=$(python -c 'import json;print(json.load(open("source.json"))["url"])')" >> "$GITHUB_OUTPUT"
          echo "name=$(python -c 'import json;print(json.load(open("source.json"))["file_name"])')" >> "$GITHUB_OUTPUT"
          echo "date=$(python -c 'import json;print(json.load(open("source.json"))["snapshot_date"])')" >> "$GITHUB_OUTPUT"

      - name: Download with resume and verify
        env:
          URL: ${{ steps.find.outputs.url }}
          NAME: ${{ steps.find.outputs.name }}
        run: |
          mkdir -p data/zip
          start=$(date +%s)
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS -L -C - --retry 5 --retry-delay 10 --retry-all-errors --connect-timeout 30 \
                 --speed-limit 50000 --speed-time 60 -o "data/zip/$NAME" "$URL"; then break; fi
            echo "attempt $attempt stopped at $(stat -c %s "data/zip/$NAME" 2>/dev/null || echo 0) bytes"; sleep 20
          done
          expected=$(curl -fsSI -L "$URL" | tr -d '\r' | awk 'tolower($1)=="content-length:"{v=$2} END{print v}')
          actual=$(stat -c %s "data/zip/$NAME")
          echo "expected=$expected actual=$actual seconds=$(( $(date +%s) - start ))"
          test -n "$expected" && test "$actual" -eq "$expected"
          unzip -tq "data/zip/$NAME"
          sha256sum "data/zip/$NAME" | tee data/zip/sha256.txt

      - name: Typed transaction layer (streamed from the ZIP, never extracted)
        run: |
          python -m pipeline.silver "data/zip/${{ steps.find.outputs.name }}" data/silver
          df -BG --output=avail / | tail -1

      - name: Aggregates
        run: |
          mkdir -p out
          python -m pipeline.gold data/silver out/fy${{ matrix.year }}.json --year ${{ matrix.year }} \
            --snapshot-date ${{ steps.find.outputs.date }} --source-zip "${{ steps.find.outputs.name }}"
          cp data/silver/_extract.json out/extract-fy${{ matrix.year }}.json
          cp source.json out/source-fy${{ matrix.year }}.json
          cp data/zip/sha256.txt out/sha256-fy${{ matrix.year }}.txt

      - name: Reconcile with USAspending's published totals
        run: python -m pipeline.reconcile out/fy${{ matrix.year }}.json out/reconcile-fy${{ matrix.year }}.json

      - name: Check disk reserve
        run: |
          free=$(df -BG --output=avail / | tail -1 | tr -dc 0-9)
          echo "free=${free}GiB"; test "$free" -ge "$RESERVE_GIB"

      - uses: actions/upload-artifact@v4
        with:
          name: summary-fy${{ matrix.year }}
          path: out/
          retention-days: 30

      - name: Keep the source ZIP and typed layer in a release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.find.outputs.name }}
          DATE: ${{ steps.find.outputs.date }}
        run: |
          tag="build-fy${{ matrix.year }}-contracts-${DATE}"
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --target main --prerelease \
              --title "FY${{ matrix.year }} national contracts, source snapshot ${DATE}" \
              --notes "Original Treasury archive and the typed transaction layer built from it. Code: ${GITHUB_SHA}."
          assets=(data/silver/part-*.parquet data/silver/_extract.json data/zip/sha256.txt)
          size=$(stat -c %s "data/zip/$NAME")
          if [ "$size" -lt 2147483648 ]; then assets+=("data/zip/$NAME"); else echo "ZIP over 2 GiB; not uploaded"; fi
          gh release upload "$tag" -R "$GITHUB_REPOSITORY" "${assets[@]}"

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Latest monthly delta file
        run: |
          python -m pipeline.fetch --year 2025 --delta > delta.json; cat delta.json
          url=$(python -c 'import json;print(json.load(open("delta.json"))["url"])')
          name=$(python -c 'import json;print(json.load(open("delta.json"))["file_name"])')
          mkdir -p data/zip out
          curl -fsS -L -C - --retry 5 --retry-delay 10 --retry-all-errors -o "data/zip/$name" "$url"
          unzip -tq "data/zip/$name"
          python -m pipeline.silver "data/zip/$name" data/delta
          python -m pipeline.changes delta data/delta out/changes.json --years 2021 2022 2023 2024 2025
          python - <<'PY'
          import json
          d = json.load(open("delta.json")); c = json.load(open("out/changes.json"))
          c["source_file"], c["snapshot_date"] = d["file_name"], d["snapshot_date"]
          json.dump(c, open("out/changes.json", "w"), indent=1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: changes
          path: out/
          retention-days: 30

  site-data:
    needs: [year, changes]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          path: inputs
      - run: python -m pipeline.site_data inputs site-data
      - uses: actions/upload-artifact@v4
        with:
          name: site-data
          path: site-data/
          retention-days: 30
