name: US download probe

on:
  push:
    branches: [probe/us-runner-download]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Runner location and disk
        run: |
          curl -sS -m 10 https://ipinfo.io/json | grep -E '"(city|region|country|org)"' || true
          df -h /

      - name: Download FY2025 contracts ZIP with resume
        env:
          URL: https://files.usaspending.gov/award_data_archive/FY2025_All_Contracts_Full_20261106.zip
        run: |
          start=$(date +%s)
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS -L -C - --retry 5 --retry-delay 10 --retry-all-errors \
                 --connect-timeout 30 --speed-limit 50000 --speed-time 60 \
                 -o contracts.zip "$URL"; then
              break
            fi
            echo "attempt $attempt stopped at $(stat -c %s contracts.zip 2>/dev/null || echo 0) bytes"
            sleep 20
          done
          end=$(date +%s)
          bytes=$(stat -c %s contracts.zip)
          secs=$((end-start))
          echo "bytes=$bytes seconds=$secs MB_per_s=$(awk "BEGIN{printf \"%.2f\", $bytes/1e6/$secs}")"
          test "$bytes" -eq 1833040425

      - name: Verify ZIP integrity
        run: |
          unzip -tq contracts.zip
          unzip -l contracts.zip | tail -3
          sha256sum contracts.zip
